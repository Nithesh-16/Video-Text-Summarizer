services:
  - type: web
    name: video-text-summarizer
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python -c "import nltk; nltk.download('punkt')"
    startCommand: |
      export STREAMLIT_SERVER_PORT=$PORT
      export STREAMLIT_SERVER_ADDRESS=0.0.0.0
      streamlit run TranscriptIQ/Home.py --server.port $PORT --server.address 0.0.0.0 --server.enableStaticServing true
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: PORT
        value: 10000
      - key: STREAMLIT_SERVER_PORT
        value: 10000
      - key: STREAMLIT_SERVER_ADDRESS
        value: 0.0.0.0
    plan: free 